services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uv
      POSTGRES_PASSWORD: uv
      POSTGRES_DB: uv
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uv -d uv"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
